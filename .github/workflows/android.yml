name: Build Kol Room for Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Generate app icon and splash resources
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#101010' --splashBackgroundColor '#101010'
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Package APK for download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/KolRoom.apk
          cd release && zip -j KolRoom-Android.zip KolRoom.apk
      - uses: actions/upload-artifact@v6
        with:
          name: KolRoom-Android
          path: release/KolRoom-Android.zip
          if-no-files-found: error
      - name: Publish latest APK ZIP on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Kol Room para Android" --notes "Descarga KolRoom-Android.zip e instala KolRoom.apk en tu dispositivo Android." --latest
          gh release upload android-latest release/KolRoom-Android.zip --clobber
